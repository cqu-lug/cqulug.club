<input type="text" id="vpnInput" placeholder="请输入需要转换的地址，如 login.cqu.edu.cn:802/eportal" style="width:80%;padding:8px;">
<button id="convertBtn" style="padding:8px 16px;">生成 Atrust VPN 地址</button>
<div id="resultArea" style="display:none;">
    转换后的 Atrust VPN 地址：
    <br>
    <input type="text" id="vpnOutput" readonly style="width:80%;padding:8px;">
    <br>
    <button id="jumpBtn" style="padding:8px 16px;">跳转</button>
    <button id="copyBtn" style="padding:8px 16px;margin-left:8px;">复制</button>
</div>

<script>
    (function() {
        var input = document.getElementById('vpnInput');
        var convertBtn = document.getElementById('convertBtn');
        var resultArea = document.getElementById('resultArea');
        var vpnOutput = document.getElementById('vpnOutput');
        var jumpBtn = document.getElementById('jumpBtn');
        var copyBtn = document.getElementById('copyBtn');

        function convertToVpnUrl(raw) {
            raw = raw.trim();
            if (raw === '') return null;

            var protocol = 'http://';
            var remaining = raw;
            if (/^https?:\/\//i.test(raw)) {
                var match = raw.match(/^(https?:\/\/)/i);
                protocol = match[1].toLowerCase();
                remaining = raw.substring(match[1].length);
            }

            var hostPart, pathPart = '';
            var slashIndex = remaining.indexOf('/');
            if (slashIndex !== -1) {
                hostPart = remaining.substring(0, slashIndex);
                pathPart = remaining.substring(slashIndex);
            } else {
                hostPart = remaining;
            }

            var hostname, port = '';
            var colonIndex = hostPart.lastIndexOf(':');
            if (colonIndex !== -1) {
                var afterColon = hostPart.substring(colonIndex + 1);
                if (/^\d+$/.test(afterColon)) {
                    port = afterColon;
                    hostname = hostPart.substring(0, colonIndex);
                } else {
                    hostname = hostPart;
                }
            } else {
                hostname = hostPart;
            }

            var convertedHost = hostname.replace(/\./g, '-');

            var portSuffix = '';
            if (port !== '') {
                portSuffix = '-' + port + '-p';
            }

            var protocolSuffix = '';
            if (protocol === 'https://') {
                protocolSuffix = '-s';
            }

            var vpnUrl = protocol + convertedHost + portSuffix + protocolSuffix + '.atrust.cqu.edu.cn' + pathPart;
            return vpnUrl;
        }

        function generateVpn() {
            var raw = input.value;
            var vpnUrl = convertToVpnUrl(raw);

            if (vpnUrl === null) {
                alert('请输入有效的地址');
                resultArea.style.display = 'none';
                return;
            }

            vpnOutput.value = vpnUrl;
            resultArea.style.display = 'block';
        }

        function jumpToVpn() {
            var url = vpnOutput.value;
            if (url) {
                window.location.href = url;
            }
        }

        function copyToClipboard() {
            var url = vpnOutput.value;
            if (!url) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                    alert('已复制到剪贴板！');
                }).catch(function() {
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
        }

        function fallbackCopy(text) {
            vpnOutput.select();
            vpnOutput.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                alert('已复制到剪贴板！');
            } catch (e) {
                alert('复制失败，请手动复制');
            }
        }

        convertBtn.addEventListener('click', generateVpn);
        jumpBtn.addEventListener('click', jumpToVpn);
        copyBtn.addEventListener('click', copyToClipboard);

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                generateVpn();
            }
        });

        input.focus();
    })();
</script>
