layout: default

mirror_status: true

<section id="mirror-list" class="mirror-status-page" data-mirror-api="https://mirrors-metadata.cqulug.club/tunasync.json">
  <header class="mirror-header">
    <h1><a href="https://mirrors.cqu.edu.cn" target="_blank" rel="noopener noreferrer">重庆大学开源软件镜像站</a> - 镜像同步状态</h1>
    <p id="mirror-status" class="mirror-status-message" role="status" aria-live="polite">正在加载镜像状态…</p>
    <button id="mirror-retry" class="mirror-retry" type="button" hidden>重新加载</button>
  </header>

  <div id="table-container" class="mirror-table-shell">
    <table class="mirror-table" id="mirror-table">
      <caption class="sr-only">重庆大学开源软件镜像站同步状态</caption>
      <thead>
      <tr>
        <th scope="col">镜像名称</th>
        <th scope="col">上游</th>
        <th scope="col">大小</th>
        <th scope="col">最后更新</th>
        <th scope="col">同步状态</th>
      </tr>
      </thead>
      <tbody id="table-body" aria-live="polite" aria-busy="true">
        {% for placeholder in (1..12) %}
        <tr class="skeleton-row" aria-hidden="true">
          <td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
